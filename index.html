<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost https://localhost">
    <script>
        // Set base URL dynamically
        (function () {
            const base = document.createElement('base');
            const path = window.location.pathname;
            const dir = path.substring(0, path.lastIndexOf('/') + 1);
            base.href = window.location.origin + dir;
            document.head.appendChild(base);
        })();
    </script>
    <title>MyPC - Premium PC Components Store</title>
    <link rel="stylesheet" href="CSS/styles.css?v=1">
</head>

<body>
    <div id="app"></div>
    <script>
        // Dynamic loader: compute app root for both http(s) and file:// environments
        (function () {
            try {
                var baseRoot;
                if (window.location.protocol === 'file:') {
                    // file:///C:/path/to/index.html -> base root is directory containing the file
                    baseRoot = window.location.href.replace(/\/[^\/]*$/, '/');
                } else {
                    baseRoot = window.location.origin;
                }
                // Load API helper first
                var apiScript = document.createElement('script');
                apiScript.src = 'JS/api.js';
                apiScript.defer = false;
                document.body.appendChild(apiScript);

                // Then load router
                var s = document.createElement('script');
                s.src = 'JS/router.js';
                s.defer = false;
                document.body.appendChild(s);
            } catch (e) {
                // fallback to relative path
                var s2 = document.createElement('script'); s2.src = 'JS/router.js'; document.body.appendChild(s2);
            }
        })();
    </script>
    <script>
        // Dev helper: ensure styles.css is reloaded during development by appending timestamp
        (function () {
            try {
                var links = document.querySelectorAll('link[rel="stylesheet"][href*="/CSS/styles.css"]');
                links.forEach(l => {
                    var href = l.getAttribute('href').split('?')[0];
                    l.setAttribute('href', href + '?v=' + Date.now());
                });
            } catch (e) { }
        })();
    </script>
</body>

</html>
