<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 
        Content Security Policy (CSP) - Strict configuration
        - No 'unsafe-inline' for scripts (all scripts moved to external files)
        - 'unsafe-inline' for styles is kept for compatibility with inline styles
        - frame-ancestors 'none' prevents clickjacking
    -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
    <!-- Note: X-Frame-Options and frame-ancestors are set via HTTP headers in .htaccess (meta tags are ineffective) -->
    <title>MyPC - Premium PC Components Store</title>
    <link rel="stylesheet" href="CSS/styles.css?v=1">
    <script src="JS/bootstrap.js" defer></script>
</head>

<body>
    <div id="app"></div>
</body>

</html>
