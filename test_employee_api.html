<!DOCTYPE html>
<html>
<head>
    <title>Test Employee Dashboard API</title>
    <script>
        // Replicate the API helper function
        const API_BASE = '/HTML_PHP';

        async function apiCall(endpoint, options = {}) {
            const url = `${API_BASE}/${endpoint}`;
            console.log('Calling API:', url);

            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        ...options.headers
                    }
                });

                const text = await response.text();
                console.log('Response text:', text.substring(0, 500));

                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseError) {
                    console.error('JSON Parse Error:', parseError);
                    console.error('Response text:', text);
                    throw new Error(`Server returned invalid JSON. Response: ${text.substring(0, 200)}`);
                }

                if (!data.success) {
                    throw new Error(data.error || 'API request failed');
                }

                return data;
            } catch (error) {
                console.error(`API Error (${endpoint}):`, error);
                throw error;
            }
        }

        // Test the getAllProducts endpoint
        async function testAllProducts() {
            try {
                console.log('Testing getAllProducts...');
                const data = await apiCall('management.php?action=getProducts');
                console.log('Success! Got', data.products?.length || 0, 'products');
                
                // Show first few products
                if (data.products && data.products.length > 0) {
                    console.table(data.products.slice(0, 5));
                }
            } catch (error) {
                console.error('Test failed:', error);
            }
        }

        // Run test on page load
        window.addEventListener('load', testAllProducts);
    </script>
</head>
<body>
    <h1>Test Employee Dashboard API</h1>
    <p>Check the browser console (F12) to see the test results.</p>
</body>
</html>
